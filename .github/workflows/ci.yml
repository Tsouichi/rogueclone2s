name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf
            autoconf
            automake
            make

      - name: Build
        run: autoreconf -i && ./configure && make

      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^AC_INIT(\[rogueclone2s\],\[\([^]]*\)\].*/\1/p' configure.ac)" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src/rogue.exe dist/
          ldd src/rogue.exe | grep ucrt64 | awk '{print $3}' | xargs -I{} cp {} dist/
          cp msg/mesg msg/mesg_E dist/

      - uses: actions/upload-artifact@v7
        with:
          name: rogueclone2s-${{ steps.version.outputs.version }}-windows-x86_64
          path: dist/

